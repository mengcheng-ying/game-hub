name: 百度链接自动推送

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  baidu-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 推送全部链接到百度
        env:
          BAIDU_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: node .github/scripts/baidu-push.js
